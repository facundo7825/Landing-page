<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Skytech — favicon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
body{display:grid;place-items:center;background:transparent}
.icon{
  width:100vmin;height:100vmin;position:relative;display:grid;place-items:center;
  background:radial-gradient(120% 120% at 30% 20%, #161a25 0%, #07080c 75%);
  border-radius:22vmin;overflow:hidden;
}
.icon::before{content:"";position:absolute;width:70vmin;height:70vmin;top:-30vmin;right:-26vmin;
  background:radial-gradient(circle,#7b6bff,transparent 65%);filter:blur(18vmin);opacity:.4}
.s{position:relative;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:78vmin;line-height:1;
  background:linear-gradient(135deg,#c9ff2e 25%,#2bf6cf 95%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 6vmin rgba(201,255,46,.45))}
.dot{position:absolute;right:18vmin;top:20vmin;width:11vmin;height:11vmin;border-radius:50%;background:#2bf6cf;box-shadow:0 0 8vmin #2bf6cf}
</style>
</head>
<body>
<div class="icon"><span class="s">S</span><span class="dot"></span></div>
<script>window.renderFavicon = () => document.fonts.ready.then(()=>true);</script>
</body>
</html>
